<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { background: white; padding: 40px; border-radius: 14px; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); border: 1px solid rgba(226, 232, 240, 0.8); max-width: 400px; width: 100%; text-align: center; animation: fadeInUp 0.4s ease-out; }
        .icon { color: #10b981; margin-bottom: 20px; }
        h1 { color: #0f172a; margin: 0 0 10px 0; font-size: 24px; }
        p { color: #64748b; margin-bottom: 25px; line-height: 1.5; }
        .details { background: #f1f5f9; padding: 20px; border-radius: 10px; margin-bottom: 30px; text-align: left; }
        .details div { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .details div:last-child { margin-bottom: 0; }
        .label { color: #64748b; font-weight: 500; }
        .value { color: #0f172a; font-weight: 600; }
        .btn { display: inline-block; background: #0f172a; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn:hover { background: #1e293b; }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h1>Payment Successful!</h1>
        <p>Your order has been received and confirmed. Thank you for shopping with us.</p>
        
        <div class="details">
            <div>
                <span class="label">Order No</span>
                <span class="value" id="orderId">-</span>
            </div>
            <div>
                <span class="label">Auth Code</span>
                <span class="value" id="authCode">-</span>
            </div>
            <div>
                <span class="label">Date</span>
                <span class="value" id="dateStr">-</span>
            </div>
        </div>

        <a href="/store.html" class="btn">Back to Store</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('orderId').textContent = params.get('orderId') || '-';
        document.getElementById('authCode').textContent = params.get('authCode') || '-';
        document.getElementById('dateStr').textContent = new Date().toLocaleString('en-US');
        
        // Sepeti temizle
        localStorage.removeItem('cartItems');
        localStorage.removeItem('cartTotal');
    </script>
</body>
</html>
