# Sekurcom - PostgreSQL & pgAdmin Docker Compose
# Çalıştırmak için: docker compose up -d
# Durdurmak için:   docker compose down
# Verileri de silip temizlemek için: docker compose down -v

services:
  # PostgreSQL Veritabanı Sunucusu
  postgres:
    image: postgres:16-alpine
    container_name: sekurcom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sekurcom2026
      POSTGRES_DB: SekurcomDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # pgAdmin - Veritabanı Yönetim Arayüzü (Tarayıcıdan erişilir)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sekurcom-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sekurcom.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
